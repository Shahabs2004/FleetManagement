name: ساخت و بررسی اولیه

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: بازیابی بسته‌ها
        run: dotnet restore FleetManagement.sln

      - name: ساخت نسخه
        run: dotnet build FleetManagement.sln --configuration Release --no-restore

      - name: اجرای آزمون‌ها
        run: dotnet test FleetManagement.sln --configuration Release --no-build --verbosity normal

      - name: انتشار خروجی وب
        if: matrix.os == 'windows-latest'
        run: dotnet publish src/FleetManagement.Web/FleetManagement.Web.csproj --configuration Release --no-build --output publish

      - name: نگهداری خروجی قابل‌دانلود
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: FleetManagement-web
          path: publish/
          if-no-files-found: error
          retention-days: 14
